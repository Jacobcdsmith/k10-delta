[project]
name = "k10-delta"
version = "0.9.2"
description = "K10-Δ — a self-modifying autonomous agent running on UNIHIKER K10 (ESP32-S3) hardware"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "websocket-client>=1.6.0",
    "libcst>=1.8.6",
]

[project.optional-dependencies]
# Enables psutil-backed host/process stats (tools/device_ns.py, tools/exec_sys.py)
# and MQTT publish/subscribe (tools/mqtt_ns.py). The agent runs without these —
# both are optional-import guarded and fall back gracefully.
extras = [
    "psutil>=5.9",
    "paho-mqtt>=1.6",
]
# Voice bridge (scripts/hermes_k10_bridge.py, scripts/sentiment_daemon.py) —
# only needed if you're running the local ASR/TTS voice stack.
voice = [
    "httpx>=0.25",
    "numpy>=1.24",
]

[tool.setuptools]
py-modules = [
    "host", "dashboard", "chrono", "goals", "goals_pursuit",
    "hermes_bridge", "selfmod", "store",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
